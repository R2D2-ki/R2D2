<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hablemos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Hablemos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <button id="btnBack" class="icon" aria-label="Back" hidden>‹</button>
  <h1 id="title">Hablemos</h1>
  <button id="btnLang" class="chip" aria-label="Idioma / Sprache">ES</button>
  <button id="btnSet" class="icon" aria-label="Settings">⚙︎</button>
</header>

<div id="banner" hidden></div>
<main id="view"></main>

<footer id="dock" hidden>
  <div class="dock-row">
    <button id="dModel" class="dbtn" aria-label="Modelo"><span class="ic">🔊</span><span class="lb" data-k="model">Modelo</span></button>
    <button id="dMine" class="dbtn" aria-label="Mi grabación"><span class="ic">▶︎</span><span class="lb" data-k="mine">Mi voz</span></button>
    <button id="dMic" class="mic" aria-label="Hablar"><span class="ring"></span><span class="ic">🎤</span></button>
    <button id="dRepeat" class="dbtn" aria-label="Repetir"><span class="ic">↻</span><span class="lb" data-k="repeat">Repetir</span></button>
    <button id="dSlow" class="dbtn" aria-label="Lento"><span class="ic">🐢</span><span class="lb" data-k="slow">Lento</span></button>
  </div>
  <div id="dStatus" class="dstatus"></div>
</footer>

<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
